openapi: 3.0.3
info:
  title: Harbor Admin API
  version: "0.1.0"
  description: >
    The Harbor control-plane admin API (`/admin/v1`) the web console consumes.
    Mesh-only (bind to Core's overlay IP). Read-only in this slice (A0.1/A0.2);
    mutating endpoints + the CLI refactor land in later A0 slices. Every
    "is it healthy/safe?" answer is computed server-side (thin client).


    Error convention: operations enumerate only the status codes that are part
    of the contract — the deterministic, client-actionable outcomes (4xx). A 500
    is abnormal operation (the server failed), NOT a defined result, so it is
    deliberately never enumerated per-operation. All error bodies are problem+json
    (see components/responses/Problem). A guard test rejects any re-added 500.
servers:
  - url: /
    description: Served by Harbor Core over the mesh.
security:
  - DevActor: []
paths:
  /admin/v1/me:
    get:
      summary: The authenticated admin principal.
      operationId: getMe
      responses:
        "200":
          description: The caller's identity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Identity" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/v1/version:
    get:
      summary: Build identity (CalVer + commit + build time) and the embedded git changelog.
      description: >-
        Returns the version/commit/build_time stamped into this Harbor binary plus the embedded
        commit log grouped by date (newest first). Drives the console version badge + changelog page;
        the response always describes the build actually running.
      operationId: getVersion
      responses:
        "200":
          description: Build identity + changelog grouped by date.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/v1/gateways:
    get:
      summary: Pull-based enrollment gateways (ADR 0005) + their collect-loop health.
      description: >-
        Lists the active enrollment gateways joined with their harbor-collect cycle health.
        A gateway whose collect cycle hasn't succeeded recently shows status=down (the signal
        that was invisible during the 2026-06-28 gateway TLS-wedge). Drives the console's
        Gateways dashboard pane. Read-only; authenticated, no special permission.
      operationId: getGateways
      responses:
        "200":
          description: Gateways + health + a status rollup.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GatewaysResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/v1/fleet/health:
    get:
      summary: Server-computed fleet health rollup.
      operationId: getFleetHealth
      responses:
        "200":
          description: The health verdict and the counts behind it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FleetHealth" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/v1/devices:
    get:
      summary: Device inventory (from heartbeats), keyset-paginated on overlay_ip.
      description: >-
        Each row carries provenance (how the host joined) and the groups it was
        issued, from its authoritative (latest issued) enrollment. Optional scope
        filters (provider, attest_account, join_key) and the health-condition filter
        narrow the list; the condition filter is the dashboard "why" drill-down,
        computed with the same thresholds as /fleet/health.
      operationId: listDevices
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 2000, default: 200 } }
        - { name: after, in: query, required: false, description: "cursor: overlay_ip of the last row from the previous page", schema: { type: string } }
        - { name: provider, in: query, required: false, description: "scope: attestation provider, e.g. aws", schema: { type: string } }
        - { name: attest_account, in: query, required: false, description: "scope: attested account/subscription/project", schema: { type: string } }
        - { name: join_key, in: query, required: false, description: "scope: join-key name the host token-enrolled with", schema: { type: string } }
        - { name: condition, in: query, required: false, description: "health drill-down (matches the dashboard verdict)", schema: { type: string, enum: [expired, expiring, stale, clock_skewed, unhealthy] } }
      responses:
        "200":
          description: A page of devices.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/v1/devices/{ip}/groups:
    patch:
      summary: Set a device's desired groups (ADR 0002). Takes effect on the host's next heartbeat-triggered renew.
      description: >-
        Server-side group reassignment: sets desired_groups and bumps the generation so the
        host re-issues on its next heartbeat. Reserved groups (control-plane/lighthouse) can be
        neither assigned nor stripped, and a device currently holding one is not manageable
        here. device:manage + step-up. Additions are effective on re-issue; removals are
        advisory until the old cert is revoked (Phase 3).
      operationId: setDeviceGroups
      parameters:
        - { name: ip, in: path, required: true, description: "the device's overlay IP", schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groups]
              properties:
                groups: { type: array, items: { type: string } }
      responses:
        "200":
          description: The updated desired-groups state.
          content:
            application/json:
              schema:
                type: object
                required: [overlay_ip, desired_groups, generation, pending]
                properties:
                  overlay_ip: { type: string }
                  desired_groups: { type: array, items: { type: string } }
                  generation: { type: integer, format: int64 }
                  pending: { type: boolean }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /admin/v1/devices/regroup:
    post:
      summary: Bulk re-group devices (ADR 0013). ?dry_run=true previews; otherwise applies the confirmed entries.
      description: >-
        Dry run (?dry_run=true) resolves a name_pattern / overlay_ips selection + an add/remove/replace
        delta into per-device absolute targets + identity tokens, excluding reserved/stale/ephemeral/
        reaped hosts (no writes). Apply commits the explicit dry-run entries under optimistic concurrency;
        an elevating or large change routes through dual-control (202 + Change). device:manage + step-up.
      operationId: regroupDevices
      parameters:
        - { name: dry_run, in: query, required: false, schema: { type: boolean } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name_pattern: { type: string }
                overlay_ips: { type: array, items: { type: string } }
                add: { type: array, items: { type: string } }
                remove: { type: array, items: { type: string } }
                replace: { type: array, items: { type: string } }
                include_stale: { type: boolean }
                entries: { type: array, items: { type: object } }
      responses:
        "200":
          description: Dry-run preview (entries + skipped + requires_dual_control), or apply results.
          content:
            application/json:
              schema: { type: object }
        "202":
          description: Elevating/large change routed to dual-control — the pending Change.
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Problem" }
  /admin/v1/devices/regroup/match:
    get:
      summary: Live match count for a re-group name_pattern (read-only preview-of-the-preview).
      description: >-
        Resolves a name_pattern to candidate devices and classifies each by the same
        reserved/stale/ephemeral/reaped exclusions the dry-run uses, returning matched/eligible
        counts + a small name sample. Powers the console's "N devices match" hint. device:manage.
      operationId: regroupMatch
      parameters:
        - { name: name_pattern, in: query, required: false, schema: { type: string } }
        - { name: include_stale, in: query, required: false, schema: { type: boolean } }
      responses:
        "200":
          description: Matched/eligible counts + skip breakdown + a name sample.
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Problem" }
  /admin/v1/audit:
    get:
      summary: Audit log, newest first, cursor-paginated.
      operationId: listAudit
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
        - { name: before, in: query, required: false, description: "cursor: return entries with seq < this", schema: { type: integer } }
      responses:
        "200":
          description: A page of audit entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/v1/audit/verify:
    get:
      summary: Audit-chain integrity (in-DB scope).
      operationId: verifyAudit
      description: >
        "verified" = clean; "tampered" = a genuine integrity failure; a 503 means
        the check could not run (NOT a claim of tampering). In-DB scope only; it
        cannot detect tail-truncation until WORM anchoring (impl 2.13) is configured.
      responses:
        "200":
          description: The verification result (verified or tampered).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditVerify" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Problem" }
  /admin/v1/lighthouses:
    get:
      summary: The lighthouse discovery fleet.
      operationId: listLighthouses
      responses:
        "200":
          description: All registered lighthouses.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LighthouseList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Register a lighthouse.
      operationId: addLighthouse
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LighthouseAdd" }
      responses:
        "201":
          description: The registered lighthouse.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lighthouse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /admin/v1/approvals:
    get:
      summary: The dual-control approvals inbox (all kinds).
      operationId: listApprovals
      parameters:
        - { name: state, in: query, required: false, description: "filter by state (pending|committed|denied|failed)", schema: { type: string } }
      responses:
        "200":
          description: Pending/decided changes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/v1/approvals/{id}:
    get:
      summary: A change with its sign-offs (payload included).
      operationId: getApproval
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: The change + sign-offs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalDetail" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
  /admin/v1/approvals/{id}/approve:
    post:
      summary: Approve a change as the authenticated principal (distinct-approver enforced).
      operationId: approveChange
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: The updated change (committed when quorum is met).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Change" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /admin/v1/approvals/{id}/deny:
    post:
      summary: Deny (veto) a change as the authenticated principal.
      operationId: denyChange
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DenyRequest" }
      responses:
        "200":
          description: The denied change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Change" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /admin/v1/config/{kind}:
    put:
      summary: >-
        Set the ENTIRE declarative config for a kind (ADR 0011 Phase 1). Validates
        inline; a non-privileged change is written directly (200); a PRIVILEGED change
        (reserved-group grant or auto_issue) routes through a distinct-second-approver
        dual-control commit (202 + a Change approved via /approvals/{id}/approve).
      operationId: setConfig
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [policy, cloudtrust, usertrust] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigBody" }
      responses:
        "200":
          description: The stored config row (non-privileged single-operator write).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigRow" }
        "202":
          description: A dual-control change opened for a PRIVILEGED config (needs a distinct second approver).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Change" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    get:
      summary: Read the stored declarative config for a kind (ADR 0011 Phase 1).
      operationId: getConfig
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [policy, cloudtrust, usertrust] } }
      responses:
        "200":
          description: The stored config row, or {set:false} when none has been written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigRow" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
  /admin/v1/policy/active:
    get:
      summary: The active fleet policy (ADR 0011 Phase 1 — from the config store).
      operationId: getActivePolicy
      responses:
        "200":
          description: The active policy, or {published:false} when none.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivePolicy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/v1/cloudtrust/active:
    get:
      summary: The active cloud-attestation trust config (ADR 0011 Phase 1 — from the config store).
      operationId: getActiveCloudTrust
      responses:
        "200":
          description: The active cloud-trust config, or {published:false} when none.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudTrustActive" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/v1/usertrust/active:
    get:
      summary: The active SSO user-trust config (ADR 0004; ADR 0011 Phase 1 — from the config store).
      operationId: getActiveUserTrust
      responses:
        "200":
          description: The active user-trust config, or {published:false} when none.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserTrustActive" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/v1/policy/compile:
    post:
      summary: Dry-run compile a draft policy for a host's groups (live analysis).
      operationId: compilePolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompileRequest" }
      responses:
        "200":
          description: Validity, invariants, and the compiled per-host firewall.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompileResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/v1/policy/reachability:
    post:
      summary: Can `from` reach `to` on proto/port under a draft policy? (A1 analysis)
      operationId: policyReachability
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReachabilityRequest" }
      responses:
        "200":
          description: The reachability decision (granting rule, or default-deny + nearest miss).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReachabilityDecision" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/v1/policy/matrix:
    post:
      summary: The all-pairs group×group reachability grid for a draft policy. (A1 analysis)
      operationId: policyMatrix
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MatrixRequest" }
      responses:
        "200":
          description: The reachability matrix.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReachabilityMatrix" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/v1/policy/tests:
    post:
      summary: Evaluate reachability assertions against a draft policy. (A1 analysis)
      operationId: policyTests
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyTestRequest" }
      responses:
        "200":
          description: Per-assertion results + pass/fail tally.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyTestResults" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/v1/policy/diff:
    post:
      summary: Flow delta (active vs draft) + blast radius. (A1.2 analysis)
      description: >-
        The user-rule reachability flows added/removed between the active published
        policy and the draft, plus the blast radius — the real hosts whose compiled
        firewall would change. Dry-run; read-only.
      operationId: policyDiff
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyDiffRequest" }
      responses:
        "200":
          description: Added/removed flows + blast radius.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyDiff" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/v1/lighthouses/{ip}:
    put:
      summary: Re-address (and re-activate) a lighthouse.
      operationId: replaceLighthouse
      parameters:
        - { name: ip, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LighthouseReplace" }
      responses:
        "200":
          description: The updated lighthouse.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lighthouse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      summary: Retire a lighthouse (refuses the last active one).
      operationId: removeLighthouse
      parameters:
        - { name: ip, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                required: [overlay_ip, removed]
                properties:
                  overlay_ip: { type: string }
                  removed: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /admin/v1/rollouts/current:
    get:
      summary: The current staged rollout + per-host wave status.
      operationId: getCurrentRollout
      responses:
        "200":
          description: The current rollout, or {active:false} when none.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RolloutStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/v1/rollouts:
    post:
      summary: Start a staged canary rollout.
      operationId: startRollout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RolloutStart" }
      responses:
        "201":
          description: The started rollout.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RolloutView" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /admin/v1/rollouts/current/step:
    post:
      summary: Force one rollout evaluation (cron/ops).
      operationId: stepRollout
      responses:
        "200":
          description: Whether the state changed, plus the current status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RolloutStepResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Problem" }
  /admin/v1/rollouts/current/abort:
    post:
      summary: Abort the active rollout (touched hosts revert to prev).
      operationId: abortRollout
      responses:
        "200":
          description: Aborted.
          content:
            application/json:
              schema:
                type: object
                required: [aborted]
                properties: { aborted: { type: boolean } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /admin/v1/releases:
    get:
      summary: The nebula + pilot release registries, each with its current rollout (ADR 0003 1c/3c). Binaries are added via the CLI; this is read + stage only.
      operationId: listReleases
      responses:
        "200":
          description: Both release lanes (registry rows + current gen + rollout).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleasesResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/v1/releases/{kind}/rollouts:
    post:
      summary: Stage a fleet upgrade to a registered release generation on the kind's canary lane.
      operationId: startReleaseRollout
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [nebula, pilot] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReleaseRolloutStart" }
      responses:
        "201":
          description: The started rollout.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RolloutView" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /admin/v1/releases/{kind}/rollouts/current/abort:
    post:
      summary: Abort the kind's active release rollout (touched hosts revert to the previous generation).
      operationId: abortReleaseRollout
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [nebula, pilot] } }
      responses:
        "200":
          description: Aborted.
          content:
            application/json:
              schema:
                type: object
                required: [aborted]
                properties: { aborted: { type: boolean } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /admin/v1/joinkeys:
    get:
      summary: List join keys (secrets never returned).
      operationId: listJoinKeys
      responses:
        "200":
          description: All join keys.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JoinKeyList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Create a join key; the secret is returned ONCE.
      operationId: createJoinKey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JoinKeyCreate" }
      responses:
        "201":
          description: The created key + its one-time secret.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JoinKeyCreated" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /admin/v1/joinkeys/{name}:
    patch:
      summary: Edit an active join key's config (groups, caps, auto-issue). Secret/name/used-count are immutable.
      operationId: updateJoinKey
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JoinKeyUpdate" }
      responses:
        "200":
          description: The updated key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JoinKey" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /admin/v1/joinkeys/{name}/revoke:
    post:
      summary: Revoke a join key by name.
      operationId: revokeJoinKey
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                type: object
                required: [name, revoked]
                properties:
                  name: { type: string }
                  revoked: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /admin/v1/enrollments:
    get:
      summary: The enrollment approval queue (keyset-paginated on id).
      operationId: listEnrollments
      parameters:
        - { name: status, in: query, required: false, description: "pending (default) | issued | denied", schema: { type: string } }
        - { name: limit, in: query, required: false, description: "page size (1..2000, default 200)", schema: { type: integer } }
        - { name: after, in: query, required: false, description: "keyset cursor: return rows with id greater than this (from next_after)", schema: { type: integer } }
      responses:
        "200":
          description: A page of enrollments in the requested status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/v1/enrollments/{id}/approve:
    post:
      summary: Approve a pending enrollment (issues a cert). Requires issuance mode.
      operationId: approveEnrollment
      parameters:
        - { name: id, in: path, required: true, description: "the enrollment_id", schema: { type: string } }
      responses:
        "200":
          description: Issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollDecision" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
  /admin/v1/enrollments/{id}/deny:
    post:
      summary: Reject a pending enrollment (no signing).
      operationId: denyEnrollment
      parameters:
        - { name: id, in: path, required: true, description: "the enrollment_id", schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DenyRequest" }
      responses:
        "200":
          description: Denied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollDecision" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /admin/v1/ipam/netblocks:
    get:
      summary: List netblocks with per-block utilization (ADR 0010 IPAM).
      operationId: listNetblocks
      responses:
        "200":
          description: All netblocks (central, default, named carves) + utilization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetblockList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Carve a new named netblock. Requires ipam:manage + step-up MFA.
      operationId: createNetblock
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NetblockCreateRequest" }
      responses:
        "201":
          description: The created netblock.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Netblock" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /admin/v1/ipam/netblocks/suggest:
    get:
      summary: Growth-aware placement suggestion for a new /N netblock.
      operationId: suggestNetblock
      parameters:
        - { name: prefix, in: query, required: true, description: "requested prefix length (1-32)", schema: { type: integer } }
      responses:
        "200":
          description: A suggested CIDR for the requested size.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetblockSuggestion" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /admin/v1/ipam/netblocks/{name}:
    patch:
      summary: Edit a netblock's CIDR/description. Both optional; protected blocks refused. Requires ipam:manage + step-up MFA.
      operationId: updateNetblock
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NetblockUpdateRequest" }
      responses:
        "200":
          description: The updated netblock.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Netblock" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      summary: Remove a netblock (protected or in-use blocks are refused). Requires ipam:manage + step-up MFA.
      operationId: removeNetblock
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                required: [name, removed]
                properties:
                  name: { type: string }
                  removed: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /admin/v1/ipam/allocations:
    get:
      summary: Allocations within a netblock (overlay/heat data).
      operationId: listIPAMAllocations
      parameters:
        - { name: netblock, in: query, required: true, description: "the netblock name", schema: { type: string } }
      responses:
        "200":
          description: Allocations inside the netblock's CIDR.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllocationList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    DevActor:
      type: apiKey
      in: header
      name: X-Harbor-Dev-Actor
      description: >
        Dev-auth seam (pre-2.11): the admin principal. Replaced by an OIDC session
        cookie at 2.11; never enabled in production.
  responses:
    Unauthorized:
      description: No / invalid admin identity.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Problem:
      description: An error.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      required: [title, status]
      properties:
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    Identity:
      type: object
      required: [principal, roles]
      properties:
        principal: { type: string }
        roles: { type: array, items: { type: string } }
        mfa_satisfied_at: { type: string, format: date-time }
    ChangelogChange:
      type: object
      required: [hash, date, subject]
      properties:
        hash: { type: string }
        date: { type: string }
        subject: { type: string }
    ChangelogDay:
      type: object
      required: [date, commits]
      properties:
        date: { type: string }
        commits: { type: array, items: { $ref: "#/components/schemas/ChangelogChange" } }
    VersionInfo:
      type: object
      required: [version, commit, build_time, days]
      properties:
        version: { type: string }
        commit: { type: string }
        build_time: { type: string }
        days: { type: array, items: { $ref: "#/components/schemas/ChangelogDay" } }
    GatewayStatus:
      type: object
      required: [name, url, status, seconds_since_success, consecutive_failures]
      properties:
        name: { type: string }
        url: { type: string }
        status: { type: string, enum: [healthy, degraded, down, unknown] }
        last_success_at: { type: string, format: date-time }
        seconds_since_success: { type: integer, description: "-1 if never succeeded" }
        consecutive_failures: { type: integer }
        last_error: { type: string }
    GatewaysResponse:
      type: object
      required: [gateways, summary]
      properties:
        gateways: { type: array, items: { $ref: "#/components/schemas/GatewayStatus" } }
        summary:
          type: object
          required: [total, healthy, degraded, down, unknown]
          properties:
            total: { type: integer }
            healthy: { type: integer }
            degraded: { type: integer }
            down: { type: integer }
            unknown: { type: integer }
    Severity:
      type: string
      enum: [info, degraded, critical]
    Reason:
      type: object
      required: [code, severity, count, detail]
      properties:
        code: { type: string }
        severity: { $ref: "#/components/schemas/Severity" }
        count: { type: integer }
        detail: { type: string }
        link: { type: string }
    FleetHealth:
      type: object
      required: [status, reasons, totals, audit_ok]
      properties:
        status:
          type: string
          enum: [healthy, degraded, critical]
        reasons:
          type: array
          items: { $ref: "#/components/schemas/Reason" }
        totals:
          type: object
          required: [total, expired, expiring, stale, clock_skewed, unhealthy]
          properties:
            total: { type: integer }
            expired: { type: integer }
            expiring: { type: integer }
            stale: { type: integer }
            clock_skewed: { type: integer }
            unhealthy: { type: integer }
        rollout_state: { type: string }
        audit_ok: { type: boolean }
    Device:
      type: object
      required: [overlay_ip, name, applied_bundle_version, clock_offset_ms]
      properties:
        overlay_ip: { type: string }
        name: { type: string }
        pilot_version: { type: string }
        nebula_version: { type: string }
        cert_not_after: { type: string, format: date-time }
        applied_bundle_version: { type: integer }
        clock_offset_ms: { type: integer }
        health: { type: string }
        last_seen: { type: string, format: date-time }
        stale: { type: boolean, description: "host has not heartbeated within StaleAfter — its reported health is no longer current (same definition as the dashboard + condition=stale filter)" }
        attest_provider: { type: string, description: "provenance: cloud-attestation provider, e.g. aws (attested hosts only)" }
        attest_account: { type: string, description: "provenance: attested account/subscription/project" }
        attest_principal: { type: string, description: "provenance: attested ARN/principal/service-account" }
        attest_region: { type: string }
        join_key_name: { type: string, description: "provenance: join-key name for token-enrolled hosts" }
        groups: { type: array, items: { type: string }, description: "groups the host was issued (from its authoritative enrollment)" }
        desired_groups: { type: array, items: { type: string }, description: "control-plane target group set (ADR 0002); equals groups unless a re-issue is pending" }
        pending: { type: boolean, description: "a group re-issue is pending — the host re-issues on its next heartbeat (groups_generation > issued_generation)" }
        reduction_pending_enforcement: { type: boolean, description: "a soft group removal whose old, higher-privilege cert is still valid (advisory until revoked, Phase 3)" }
        ephemeral: { type: boolean, description: "host joined via an ephemeral join key (shorter cert TTL; foundation for auto-reaping, impl 2.12)" }
        reaped_at: { type: string, format: date-time, description: "when the reaper soft-reclaimed this device (impl 2.12); absent for live hosts. A reaped host's heartbeat is deleted, so it normally leaves the heartbeat-driven list — present for completeness / a future include-reaped view" }
        reap_reason: { type: string, description: "why the device was reaped: cert-expired | silent (impl 2.12); absent for live hosts" }
    DeviceList:
      type: object
      required: [devices, count]
      properties:
        devices: { type: array, items: { $ref: "#/components/schemas/Device" } }
        count: { type: integer, description: "page size, NOT the fleet total" }
        next_after: { type: string, description: "cursor for the next page (present only when more rows exist)" }
    AuditRow:
      type: object
      required: [seq, ts, actor, action]
      properties:
        seq: { type: integer, format: int64 }
        ts: { type: string, format: date-time }
        actor: { type: string }
        action: { type: string }
        target: { type: string }
        details: { type: string }
    AuditList:
      type: object
      required: [entries, count]
      properties:
        entries: { type: array, items: { $ref: "#/components/schemas/AuditRow" } }
        count: { type: integer }
        next_before: { type: integer, format: int64, description: "cursor for the next (older) page" }
    AuditVerify:
      type: object
      required: [status, ok, verified_rows, scope]
      properties:
        status:
          type: string
          enum: [verified, tampered]
        ok: { type: boolean }
        verified_rows: { type: integer, format: int64 }
        scope: { type: string }
        detail: { type: string }
    Lighthouse:
      type: object
      required: [overlay_ip, state, public_addrs]
      properties:
        overlay_ip: { type: string }
        hostname: { type: string }
        state: { type: string }
        public_addrs: { type: array, items: { type: string } }
    LighthouseList:
      type: object
      required: [lighthouses, count]
      properties:
        lighthouses: { type: array, items: { $ref: "#/components/schemas/Lighthouse" } }
        count: { type: integer }
    Change:
      type: object
      required: [id, kind, state, quorum, proposer, payload_sha256, created_at]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string }
        target: { type: string }
        state: { type: string, description: "pending | committing | committed | denied | failed" }
        quorum: { type: integer }
        proposer: { type: string }
        payload_sha256: { type: string }
        created_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time }
        payload: { type: string, description: "the proposed content (e.g. the policy DSL); included on detail, not in lists" }
    Signoff:
      type: object
      required: [actor, decision, created_at]
      properties:
        actor: { type: string }
        decision: { type: string, enum: [approve, deny] }
        created_at: { type: string, format: date-time }
    ApprovalList:
      type: object
      required: [approvals, count]
      properties:
        approvals: { type: array, items: { $ref: "#/components/schemas/Change" } }
        count: { type: integer }
    ApprovalDetail:
      type: object
      required: [change, signoffs]
      properties:
        change: { $ref: "#/components/schemas/Change" }
        signoffs: { type: array, items: { $ref: "#/components/schemas/Signoff" } }
    ConfigBody:
      description: >-
        The ENTIRE config for a kind (ADR 0011 Phase 1, PUT /admin/v1/config/{kind}).
        Shape depends on {kind}: for policy the body is the firewall policy DSL as a
        JSON string; for cloudtrust it is {default_groups, aws}; for usertrust it is
        {default_groups, idp_entries}. The server validates the body against the kind.
    ConfigRow:
      type: object
      required: [kind, set]
      properties:
        kind: { type: string, enum: [policy, cloudtrust, usertrust] }
        set: { type: boolean, description: "false when no config of this kind has been written yet" }
        version: { type: integer, format: int64, description: "monotonic, bumped on every write" }
        payload: { type: string, description: "the stored canonical config bytes" }
        updated_at: { type: string }
        updated_by: { type: string }
    DenyRequest:
      type: object
      properties:
        reason: { type: string }
    PolicyRule:
      type: object
      required: [from, to, proto, port]
      properties:
        from: { type: string }
        to: { type: string }
        proto: { type: string }
        port: { type: string }
    ActivePolicy:
      type: object
      required: [published]
      properties:
        published: { type: boolean }
        version: { type: integer, format: int64 }
        hash: { type: string }
        text: { type: string }
        rules: { type: array, items: { $ref: "#/components/schemas/PolicyRule" } }
    CloudTrustAccount:
      type: object
      required: [account]
      properties:
        account: { type: string, description: "AWS account id (exact match)" }
        arn_patterns: { type: array, items: { type: string }, description: "allowed caller-ARN globs; empty = any ARN in the account" }
        groups: { type: array, items: { type: string }, description: "groups granted to hosts attesting from this account" }
        auto_issue: { type: boolean, description: "issue immediately vs queue for manual approval" }
        netblock: { type: string, description: "named IPAM netblock hosts from this scope draw their overlay IP from (ADR 0010); empty = the default block" }
    CloudTrustActive:
      type: object
      required: [published]
      properties:
        published: { type: boolean }
        version: { type: integer, format: int64 }
        hash: { type: string }
        default_groups: { type: array, items: { type: string }, description: "granted to every validly-attested host" }
        aws: { type: array, items: { $ref: "#/components/schemas/CloudTrustAccount" } }
    IDPEntry:
      type: object
      required: [realm, directory_group]
      properties:
        realm: { type: string, description: "IdP/tenant realm; matched EXACTLY against the assertion issuer (ADR 0004 S2)" }
        directory_group: { type: string, description: "SAML/OIDC AD-group name this entry keys on" }
        mesh_groups: { type: array, items: { type: string }, description: "nebula groups granted to a host matching this entry, on top of default_groups" }
        auto_issue: { type: boolean, description: "issue immediately vs queue for manual approval (defaults off, S8)" }
        netblock: { type: string, description: "named IPAM netblock matching hosts draw their overlay IP from (ADR 0010); empty = the default block" }
    UserTrustActive:
      type: object
      required: [published]
      properties:
        published: { type: boolean }
        version: { type: integer, format: int64 }
        hash: { type: string }
        default_groups: { type: array, items: { type: string }, description: "granted to every validly SSO-enrolled host" }
        idp_entries: { type: array, items: { $ref: "#/components/schemas/IDPEntry" } }
    CompileRequest:
      type: object
      required: [policy]
      properties:
        policy: { type: string }
        groups: { type: array, items: { type: string } }
    CompiledRule:
      type: object
      required: [proto, port]
      properties:
        proto: { type: string }
        port: { type: string }
        host: { type: string }
        group: { type: string }
    CompileResult:
      type: object
      required: [valid, invariants_ok]
      properties:
        valid: { type: boolean }
        error: { type: string }
        invariants_ok: { type: boolean }
        compiled:
          type: object
          required: [inbound, outbound]
          properties:
            inbound: { type: array, items: { $ref: "#/components/schemas/CompiledRule" } }
            outbound: { type: array, items: { $ref: "#/components/schemas/CompiledRule" } }
    ReachabilityRequest:
      type: object
      required: [policy, from, to]
      properties:
        policy: { type: string }
        from: { type: string }
        to: { type: string }
        proto: { type: string, description: "tcp|udp|icmp|any (default any)" }
        port: { type: string, description: "any|N (default any)" }
    ReachabilityDecision:
      type: object
      required: [allowed, reason]
      properties:
        allowed: { type: boolean }
        reason: { type: string, description: "rule | baseline-control-plane | baseline-icmp | default-deny" }
        rule: { $ref: "#/components/schemas/PolicyRule" }
        nearest: { $ref: "#/components/schemas/PolicyRule" }
    MatrixRequest:
      type: object
      required: [policy]
      properties:
        policy: { type: string }
        groups: { type: array, items: { type: string }, description: "defaults to the groups named in the policy" }
    Flow:
      type: object
      required: [proto, port]
      properties:
        proto: { type: string }
        port: { type: string }
    MatrixCell:
      type: object
      required: [from, to, flows, baseline]
      properties:
        from: { type: string }
        to: { type: string }
        flows: { type: array, items: { $ref: "#/components/schemas/Flow" } }
        baseline: { type: boolean, description: "to is the control plane (always reachable)" }
    ReachabilityMatrix:
      type: object
      required: [groups, cells]
      properties:
        groups: { type: array, items: { type: string } }
        cells: { type: array, items: { $ref: "#/components/schemas/MatrixCell" } }
    PolicyTestRequest:
      type: object
      required: [policy, tests]
      properties:
        policy: { type: string }
        tests: { type: string, description: "assert allow|deny <from> -> <to> <proto> <port> per line" }
    PolicyTestAssertion:
      type: object
      required: [expect, from, to, proto, port, line]
      properties:
        expect: { type: boolean }
        from: { type: string }
        to: { type: string }
        proto: { type: string }
        port: { type: string }
        line: { type: integer }
    PolicyTestResult:
      type: object
      required: [assertion, got, pass, reason]
      properties:
        assertion: { $ref: "#/components/schemas/PolicyTestAssertion" }
        got: { type: boolean }
        pass: { type: boolean }
        reason: { type: string }
    PolicyTestResults:
      type: object
      required: [results, passed, failed, ok]
      properties:
        results: { type: array, items: { $ref: "#/components/schemas/PolicyTestResult" } }
        passed: { type: integer }
        failed: { type: integer }
        ok: { type: boolean }
    PolicyDiffRequest:
      type: object
      required: [policy]
      properties:
        policy: { type: string, description: "the draft DSL; diffed against the active committed policy" }
    FlowDelta:
      type: object
      required: [from, to, flow]
      properties:
        from: { type: string, description: "literal rule from-group (may be 'any')" }
        to: { type: string, description: "literal rule to-group (may be 'any')" }
        flow: { $ref: "#/components/schemas/Flow" }
    BlastRadius:
      type: object
      required: [count, total]
      properties:
        count: { type: integer, description: "true number of hosts whose firewall changes" }
        total: { type: integer, description: "total issued hosts in the fleet" }
        hosts: { type: array, items: { type: string }, description: "affected overlay IPs (capped; count is authoritative)" }
        truncated: { type: boolean, description: "true if the hosts list was capped" }
    PolicyDiff:
      type: object
      required: [active, added, removed, blast]
      properties:
        active:
          type: object
          description: "the active-policy identity the diff was computed against (published:false if none)"
          required: [published]
          properties:
            published: { type: boolean }
            version: { type: integer, format: int64 }
            hash: { type: string }
        added: { type: array, items: { $ref: "#/components/schemas/FlowDelta" } }
        removed: { type: array, items: { $ref: "#/components/schemas/FlowDelta" } }
        blast: { $ref: "#/components/schemas/BlastRadius" }
        warning: { type: string, description: "present if the draft violates a publish invariant (it can be previewed but never committed)" }
    LighthouseAdd:
      type: object
      required: [overlay_ip, public_addrs]
      properties:
        overlay_ip: { type: string }
        hostname: { type: string }
        public_addrs: { type: array, items: { type: string } }
    LighthouseReplace:
      type: object
      required: [public_addrs]
      properties:
        public_addrs: { type: array, items: { type: string } }
    RolloutView:
      type: object
      required: [id, target_version, prev_version, state, active_wave, wave_size, min_healthy, created_at]
      properties:
        id: { type: integer, format: int64 }
        description: { type: string }
        target_version: { type: integer }
        prev_version: { type: integer }
        state: { type: string, description: "canary | widening | completed | rolledback (operator-abort lands as rolledback)" }
        active_wave: { type: integer }
        wave_size: { type: integer }
        min_healthy: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        note: { type: string }
    RolloutHost:
      type: object
      required: [overlay_ip, wave, status]
      properties:
        overlay_ip: { type: string }
        wave: { type: integer }
        status: { type: string, description: "waiting | converged | failed | reverted" }
    RolloutStatus:
      type: object
      required: [active, hosts]
      properties:
        active: { type: boolean }
        rollout: { $ref: "#/components/schemas/RolloutView" }
        hosts: { type: array, items: { $ref: "#/components/schemas/RolloutHost" } }
    RolloutStart:
      type: object
      required: [target_version, hosts]
      properties:
        target_version: { type: integer }
        prev_version: { type: integer }
        hosts: { type: array, items: { type: string } }
        canary_size: { type: integer }
        wave_size: { type: integer }
        min_healthy: { type: integer }
        observe_seconds: { type: integer }
        missing_after_seconds: { type: integer }
        description: { type: string }
    RolloutStepResult:
      type: object
      required: [changed, status]
      properties:
        changed: { type: boolean }
        status: { $ref: "#/components/schemas/RolloutStatus" }
    ReleaseView:
      type: object
      required: [gen, version, sha256, url, status, created_at]
      properties:
        gen: { type: integer, format: int64, description: "the generation the rollout lane stages" }
        version: { type: string }
        sha256: { type: string, description: "the integrity anchor the pilot verifies before swap" }
        url: { type: string, description: "where the pilot fetches the artifact (operator-hosted)" }
        status: { type: string, description: "candidate | current | superseded" }
        note: { type: string }
        created_at: { type: string, format: date-time }
    ReleaseLane:
      type: object
      required: [releases, current_gen]
      properties:
        releases: { type: array, items: { $ref: "#/components/schemas/ReleaseView" } }
        current_gen: { type: integer, description: "the live fleet-desired generation (0 = none)" }
        rollout:
          allOf: [{ $ref: "#/components/schemas/RolloutStatus" }]
          nullable: true
          description: "the lane's current rollout, or null when none"
    ReleasesResponse:
      type: object
      required: [nebula, pilot]
      properties:
        nebula: { $ref: "#/components/schemas/ReleaseLane" }
        pilot: { $ref: "#/components/schemas/ReleaseLane" }
    ReleaseRolloutStart:
      type: object
      required: [gen]
      properties:
        gen: { type: integer, description: "the registered generation to stage" }
        canary_size: { type: integer }
        wave_size: { type: integer }
        observe_seconds: { type: integer }
        missing_after_seconds: { type: integer }
    JoinKey:
      type: object
      required: [name, groups, max_uses, used_count, auto_issue, ephemeral, quota_per_hour, state, created_at]
      properties:
        name: { type: string }
        groups: { type: array, items: { type: string } }
        sub_range: { type: string }
        max_uses: { type: integer }
        used_count: { type: integer }
        auto_issue: { type: boolean }
        ephemeral: { type: boolean }
        quota_per_hour: { type: integer }
        expires_at: { type: string, format: date-time }
        state: { type: string }
        created_at: { type: string, format: date-time }
    JoinKeyList:
      type: object
      required: [joinkeys, count]
      properties:
        joinkeys: { type: array, items: { $ref: "#/components/schemas/JoinKey" } }
        count: { type: integer }
    JoinKeyCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        groups: { type: array, items: { type: string } }
        sub_range: { type: string }
        max_uses: { type: integer }
        ttl_seconds: { type: integer }
        auto_issue: { type: boolean }
        ephemeral: { type: boolean }
        quota_per_hour: { type: integer }
    JoinKeyUpdate:
      type: object
      description: "All fields optional; an omitted field is left unchanged (active keys only). name/secret/used_count/state are immutable."
      properties:
        groups: { type: array, items: { type: string } }
        sub_range: { type: string }
        max_uses: { type: integer, description: "0 = unlimited" }
        quota_per_hour: { type: integer, description: "0 = no rate limit" }
        auto_issue: { type: boolean }
        ephemeral: { type: boolean }
        ttl_seconds: { type: integer, description: "relative, re-based from now; 0 = never expire" }
    JoinKeyCreated:
      type: object
      required: [secret, joinkey]
      properties:
        secret: { type: string, description: "the join-key secret — shown ONCE" }
        joinkey: { $ref: "#/components/schemas/JoinKey" }
    Netblock:
      type: object
      required: [name, cidr, kind, protected, capacity, allocated, used, pct, created_at]
      properties:
        name: { type: string }
        cidr: { type: string, description: "the netblock's IPv4 CIDR, e.g. 10.44.20.0/24" }
        kind: { type: string, enum: [reserved, default, named] }
        description: { type: string }
        protected: { type: boolean, description: "central/default cannot be edited or removed" }
        capacity: { type: integer, description: "usable host count (CIDR size minus the network address)" }
        allocated: { type: integer, description: "current allocations inside the CIDR" }
        used: { type: integer, description: "live addresses: allocations whose host has heartbeated within the fleet stale window (StaleAfter); a subset of allocated, decaying as hosts go stale" }
        pct: { type: number, description: "allocated / capacity * 100 (one decimal)" }
        created_at: { type: string, format: date-time }
        created_by: { type: string }
    NetblockList:
      type: object
      required: [netblocks, count]
      properties:
        netblocks: { type: array, items: { $ref: "#/components/schemas/Netblock" } }
        count: { type: integer }
        pool: { type: string, description: "the configured overlay pool CIDR (e.g. 10.44.0.0/16); the UI uses this as the address-map extent. Absent/empty when no pool is configured." }
    NetblockCreateRequest:
      type: object
      required: [name, cidr]
      properties:
        name: { type: string }
        cidr: { type: string, description: "the IPv4 CIDR to carve, e.g. 10.44.20.0/24" }
        description: { type: string }
    NetblockUpdateRequest:
      type: object
      description: "Both fields optional; an omitted field is left unchanged. Protected (central/default) blocks are refused."
      properties:
        cidr: { type: string }
        description: { type: string }
    NetblockSuggestion:
      type: object
      required: [prefix, cidr]
      properties:
        prefix: { type: integer, description: "the requested prefix length" }
        cidr: { type: string, description: "a growth-aware placement CIDR for that size" }
    Allocation:
      type: object
      required: [ip]
      properties:
        ip: { type: string }
        device: { type: string }
        method: { type: string, description: "token | aws-sigv4 | sso | genesis" }
        allocated_at: { type: string, format: date-time }
    AllocationList:
      type: object
      required: [netblock, cidr, allocations, count]
      properties:
        netblock: { type: string }
        cidr: { type: string }
        allocations: { type: array, items: { $ref: "#/components/schemas/Allocation" } }
        count: { type: integer }
    EnrollmentView:
      type: object
      required: [enrollment_id, device_name, pubkey_hash, method, groups, status, created_at]
      properties:
        enrollment_id: { type: string }
        device_name: { type: string }
        pubkey_hash: { type: string, description: "fingerprint of the host pubkey; the key bytes are never returned" }
        method: { type: string }
        join_key_id: { type: integer }
        join_key_name: { type: string, description: "name of the join key (resolved from join_key_id); token enrollments only" }
        groups: { type: array, items: { type: string } }
        status: { type: string, description: "pending | issued | denied" }
        ephemeral: { type: boolean, description: "enrollment via an ephemeral join key (shorter cert TTL; foundation for auto-reaping, impl 2.12)" }
        overlay_ip: { type: string }
        created_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time }
        approver: { type: string }
        attest_provider: { type: string, description: "cloud-attestation provider, e.g. aws (M5)" }
        attest_account: { type: string, description: "attested account/subscription/project" }
        attest_principal: { type: string, description: "attested ARN/principal/service-account" }
        attest_region: { type: string }
        verified_at: { type: string, format: date-time }
    EnrollmentList:
      type: object
      required: [enrollments, count]
      properties:
        enrollments: { type: array, items: { $ref: "#/components/schemas/EnrollmentView" } }
        count: { type: integer, description: "page size — NOT the queue total" }
        next_after: { type: integer, description: "keyset cursor for the next page; absent on the last page" }
    EnrollDecision:
      type: object
      required: [enrollment_id, status]
      properties:
        enrollment_id: { type: string }
        status: { type: string, description: "issued | denied" }
        overlay_ip: { type: string }
